name: Build Tiny11 ARM64 Core ISO Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-11-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows 11 ARM64 ISO to D Drive
        run: |
          Write-Host "Starting download to D drive..."
          # 关键修改：下载到 D 盘，避开 C 盘空间限制
          Invoke-WebRequest -Uri "https://software.download.prss.microsoft.com/dbazure/Windows11_Client_arm64_zh-cn_26300_9457.iso?t=ad4b29f3-2fb9-4803-b2e9-fe67e77f7d21&P1=1791179844&P2=602&P3=2&P4=q1P2hUraswUt8byc06Ohjacg9m9NXvRskPedjjklqBtIz9FMJ8LHAGRXk3GhFUlX26KPvHXhvTio53HENi8%2fbOA6DaVZo1G%2bpg3VruDyUOdKv3A1zMYaYa1BVyqW5%2brcQCdLJXWEWTPjuhUL7GLDDlTeUfO9G4Ow%2baHYJA%2bDDLilAC8DvrL2m8NoTCraF0lKAt78Jxcab%2fb76OLU9FcYNohRbm7dxLG4yEiLMaWQNlJfD6ijlf9wDtZ0iP20V304PI6wNpkezZjMxAJJdMI6Ql2U7BARdpx6DU%2fogdbY0ez%2b%2bAO1IqQCYiwbUWhb54Dww29f5zNacW9%2fF%2bOz5q5%2fSg%3d%3d" -OutFile "D:\win11-arm64.iso" -UseBasicParsing
          $fileInfo = Get-Item "D:\win11-arm64.iso"
          if ($fileInfo.Length -lt 1GB) {
            Write-Error "ISO file seems too small, download might have failed."
          }
          Write-Host "Download complete. Size: $($fileInfo.Length / 1GB) GB"

      - name: Mount ISO and get drive letter
        id: mount
        run: |
          $mountResult = Mount-DiskImage -ImagePath "D:\win11-arm64.iso" -PassThru
          $driveLetter = ($mountResult | Get-Volume).DriveLetter
          echo "ISO_DRIVE=$driveLetter" >> $env:GITHUB_ENV
          Write-Host "ISO mounted at $driveLetter`:"

      - name: Run tiny11 Core Builder Script on D Drive
        run: |
          # 关键修改：把 -WorkDrive 设定为 D 盘，让脚本的所有临时文件都落在 D 盘
          # 同时输出 ISO 也指向 D 盘
          .\tiny11AICoremaker.ps1 -ISODrive "$env:ISO_DRIVE" -WorkDrive "D:" -OutputISO "D:\tiny11-arm64.iso" -AssumeYes

      - name: Dismount ISO
        if: always()
        run: |
          Dismount-DiskImage -ImagePath "D:\win11-arm64.iso" -ErrorAction SilentlyContinue

      - name: Upload ISO as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiny11-arm64-iso-final
          path: D:\tiny11-arm64.iso
